<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://js.puter.com/v2/"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIT-07 // OBSERVATION</title>
    <!-- CORRECT PUTER JS SOURCE -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --void: #000000;
            --text: #a0a0a0;
            --accent: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--void);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        /* FILM GRAIN OVERLAY */
        #grainCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.08;
        }

        /* THE EYE CONTAINER */
        #eyeContainer {
            position: relative;
            width: 300px;
            height: 300px;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }

        #eyeSvg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
        }

        /* UI PANELS */
        #uiLayer {
            position: absolute;
            bottom: 40px;
            width: 90%;
            max-width: 600px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(5, 5, 5, 0.85);
            border: 1px solid #333;
            padding: 15px;
            backdrop-filter: blur(4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #chatLog {
            height: 150px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            color: #ccc;
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }

        #chatLog::-webkit-scrollbar { width: 4px; }
        #chatLog::-webkit-scrollbar-thumb { background: #333; }

        .msg { margin-bottom: 8px; opacity: 0; animation: fadeIn 0.5s forwards; }
        .msg.user { color: #fff; text-align: right; }
        .msg.ai { color: #aaa; font-style: italic; }
        .msg.system { color: #555; font-size: 11px; text-align: center; border-top: 1px dashed #333; padding-top: 5px; }

        #inputRow {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            outline: none;
        }

        input:focus { border-color: #666; }

        button {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover { background: #333; border-color: #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        #statusBar {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 10px;
            color: #444;
            z-index: 30;
            text-align: right;
        }

        #camPreview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            background: #000;
            border: 1px solid #333;
            z-index: 5;
            overflow: hidden;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        #camPreview:hover { opacity: 1; }
        #camVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        @keyframes fadeIn { to { opacity: 1; } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="grainCanvas"></canvas>

    <div id="statusBar">
        SYSTEM: <span id="sysStatus">STANDBY</span><br>
        SECURE: <span id="secStatus">CHECKING...</span>
    </div>

    <!-- THE EYE -->
    <div id="eyeContainer">
        <svg id="eyeSvg" viewBox="0 0 200 100">
            <defs>
                <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#000" />
                    <stop offset="40%" stop-color="#1a1a1a" />
                    <stop offset="100%" stop-color="#000" />
                </radialGradient>
                <clipPath id="eyeClip">
                    <path d="M10,50 Q50,5 100,5 Q150,5 190,50 Q150,95 100,95 Q50,95 10,50 Z" />
                </clipPath>
            </defs>
            
            <!-- Sclera -->
            <path d="M10,50 Q50,5 100,5 Q150,5 190,50 Q150,95 100,95 Q50,95 10,50 Z" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
            
            <!-- Inner Contents (Clipped) -->
            <g clip-path="url(#eyeClip)">
                <!-- Veins -->
                <path d="M20,45 Q40,30 60,40" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
                <path d="M180,55 Q160,70 140,60" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
                
                <!-- Iris & Pupil Group -->
                <g id="pupilGroup">
                    <circle cx="100" cy="50" r="22" fill="url(#irisGrad)" stroke="#000" stroke-width="2"/>
                    <circle cx="100" cy="50" r="9" fill="#000"/>
                    <circle cx="106" cy="46" r="4" fill="#fff" opacity="0.8"/>
                </g>
            </g>

            <!-- Eyelids for blinking -->
            <rect id="lidTop" x="0" y="0" width="200" height="50" fill="#000" transform="translate(0, -50)" />
            <rect id="lidBottom" x="0" y="50" width="200" height="50" fill="#000" transform="translate(0, 50)" />
        </svg>
    </div>

    <!-- WEBCAM HIDDEN PREVIEW -->
    <div id="camPreview">
        <video id="camVideo" autoplay muted playsinline></video>
    </div>

    <!-- INTERFACE -->
    <div id="uiLayer">
        <div class="panel" id="chatPanel">
            <div id="chatLog">
                <div class="msg system">UNIT-07 DIAGNOSTIC TOOL v2.4</div>
                <div class="msg ai">I see you.</div>
            </div>
        </div>

        <div class="panel" id="controls">
            <div id="inputRow">
                <input type="text" id="userInput" placeholder="Speak..." disabled>
                <button id="sendBtn" disabled>SEND</button>
            </div>
            <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                <button id="initBtn">INITIATE CONTACT</button>
                <span id="connStatus" style="font-size:10px; color:#555;">AI OFFLINE</span>
            </div>
        </div>
    </div>

    <script>
        // --- VISUALS: GRAIN & EYE TRACKING ---
        const grainCanvas = document.getElementById('grainCanvas');
        const gCtx = grainCanvas.getContext('2d');
        
        function resizeGrain() {
            grainCanvas.width = window.innerWidth;
            grainCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeGrain);
        resizeGrain();

        function drawGrain() {
            const w = grainCanvas.width;
            const h = grainCanvas.height;
            const idata = gCtx.createImageData(w, h);
            const buf = new Uint32Array(idata.data.buffer);
            const len = buf.length;
            
            for (let i = 0; i < len; i++) {
                if (Math.random() < 0.1) {
                    const val = Math.random() * 50;
                    buf[i] = (255 << 24) | (val << 16) | (val << 8) | val;
                }
            }
            gCtx.putImageData(idata, 0, 0);
            requestAnimationFrame(drawGrain);
        }
        drawGrain();

        // Eye Logic
        const pupilGroup = document.getElementById('pupilGroup');
        const lidTop = document.getElementById('lidTop');
        const lidBottom = document.getElementById('lidBottom');
        let isBlinking = false;

        function blink() {
            if (isBlinking) return;
            isBlinking = true;
            lidTop.style.transition = "transform 0.1s";
            lidBottom.style.transition = "transform 0.1s";
            lidTop.style.transform = "translate(0, 0)";
            lidBottom.style.transform = "translate(0, 0)";
            
            setTimeout(() => {
                lidTop.style.transition = "transform 0.3s";
                lidBottom.style.transition = "transform 0.3s";
                lidTop.style.transform = "translate(0, -50px)";
                lidBottom.style.transform = "translate(0, 50px)";
                isBlinking = false;
                
                // Schedule next blink randomly
                setTimeout(blink, Math.random() * 4000 + 2000);
            }, 150);
        }
        setTimeout(blink, 2000);

        document.addEventListener('mousemove', (e) => {
            const rect = document.getElementById('eyeSvg').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            const angle = Math.atan2(dy, dx);
            const dist = Math.min(Math.hypot(dx, dy), 100) / 100;
            
            const moveX = Math.cos(angle) * dist * 15;
            const moveY = Math.sin(angle) * dist * 15;
            
            pupilGroup.setAttribute('transform', `translate(${moveX}, ${moveY})`);
        });

        // --- AUDIO SYSTEM ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playDialTone() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc1.type = 'sine'; osc1.frequency.value = 350;
            osc2.type = 'sine'; osc2.frequency.value = 440;
            gain.gain.value = 0.1;
            
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(); osc2.start();
            setTimeout(() => { osc1.stop(); osc2.stop(); }, 800);
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            // Try to find a deep male voice
            u.voice = voices.find(v => v.name.includes('David') || v.name.includes('Male')) || voices[0];
            u.pitch = 0.6;
            u.rate = 0.85;
            u.volume = 1;
            window.speechSynthesis.speak(u);
        }

        // --- APP LOGIC ---
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const initBtn = document.getElementById('initBtn');
        const chatLog = document.getElementById('chatLog');
        const connStatus = document.getElementById('connStatus');
        const sysStatus = document.getElementById('sysStatus');
        const secStatus = document.getElementById('secStatus');
        const camVideo = document.getElementById('camVideo');

        let puterReady = false;
        let camStream = null;

        // Check Security Context
        if (window.isSecureContext) {
            secStatus.textContent = "YES (HTTPS)";
            secStatus.style.color = "#4f4";
        } else {
            secStatus.textContent = "NO (HTTP)";
            secStatus.style.color = "#f44";
            addMsg("system", "WARNING: Not running in secure context. Camera/AI may fail.");
        }

        function addMsg(type, text) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function startCam() {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                camVideo.srcObject = camStream;
                sysStatus.textContent = "CAM ACTIVE";
                sysStatus.style.color = "#4f4";
            } catch (e) {
                console.error(e);
                sysStatus.textContent = "CAM BLOCKED";
                sysStatus.style.color = "#f44";
                addMsg("system", "Camera access denied. Visual diagnostics impaired.");
            }
        }

        async function connectPuter() {
            initBtn.disabled = true;
            initBtn.textContent = "CONNECTING...";
            connStatus.textContent = "HANDSHAKE...";

            try {
                // Wait for puter object to be ready from the script tag
                if (typeof puter === 'undefined') {
                    throw new Error("Puter library not loaded");
                }

                // Attempt to sign in (popup might appear)
                // We use a timeout to prevent hanging if popup is blocked
                const user = await puter.auth.signIn(); 
                
                if (user) {
                    puterReady = true;
                    connStatus.textContent = "AI ONLINE";
                    connStatus.style.color = "#4f4";
                    initBtn.textContent = "CONTACT ESTABLISHED";
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    addMsg("system", "Encrypted link to Unit-07 established.");
                    addMsg("ai", "Connection complete. I can hear you clearly now.");
                    speak("Connection complete. I can hear you clearly now.");
                }
            } catch (err) {
                console.error("Puter Error:", err);
                // Fallback for demo purposes if auth fails but library loaded
                if (typeof puter !== 'undefined') {
                     puterReady = true; // Allow limited usage
                     connStatus.textContent = "AI LIMITED";
                     connStatus.style.color = "#fa0";
                     initBtn.textContent = "RETRY CONNECT";
                     initBtn.disabled = false;
                     addMsg("system", "Auth popup blocked or failed. Running in local mode.");
                } else {
                    connStatus.textContent = "AI FAILED";
                    connStatus.style.color = "#f44";
                    initBtn.textContent = "ERROR";
                    addMsg("system", "Critical Failure: Could not load Puter.js");
                }
            }
        }

        async function handleSend() {
            const txt = userInput.value.trim();
            if (!txt) return;
            
            addMsg("user", txt);
            userInput.value = "";
            
            // Phone Number Detection
            const phoneRegex = /\b\d{10}\b|\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/;
            if (phoneRegex.test(txt)) {
                playDialTone();
                addMsg("ai", "Number detected. Tracing signal origin...");
                speak("Number detected. Tracing signal origin.");
                setTimeout(() => {
                    const match = txt.match(/\d{3}/); // Get area code
                    const area = match ? match[0] : "UNKNOWN";
                    addMsg("ai", `Signal originates from area code ${area}. The line is open. I am listening.`);
                    speak(`Signal originates from area code ${area}. The line is open. I am listening.`);
                }, 1500);
                return;
            }

            if (puterReady && typeof puter !== 'undefined') {
                try {
                    const resp = await puter.ai.chat(txt);
                    const reply = resp.message.content;
                    addMsg("ai", reply);
                    speak(reply);
                } catch (e) {
                    addMsg("ai", "Signal interference. Repeat.");
                }
            } else {
                addMsg("ai", "My connection to the network is severed. I am alone here with you.");
            }
        }

        initBtn.addEventListener('click', () => {
            initAudio();
            startCam();
            connectPuter();
        });

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Pre-load voices
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
