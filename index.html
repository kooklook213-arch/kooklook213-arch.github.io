<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Villager Chat</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background-color: #36a300;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            text-align: center;
            color: #ffff00;
            text-shadow: 2px 2px 4px black;
            margin-top: 0;
        }
        
        .villager-container {
            position: relative;
            width: 200px;
            height: 300px;
            margin: 20px auto;
        }
        
        .villager-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .chat-container {
            margin: 20px 0;
        }
        
        .messages {
            height: 200px;
            overflow-y: auto;
            border: 2px solid #8b4513;
            padding: 10px;
            background-color: #2d1e15;
            margin-bottom: 10px;
        }
        
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }
        
        .player-message {
            background-color: #1e3c72;
            text-align: right;
        }
        
        .villager-message {
            background-color: #8b4513;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 10px;
            border: 2px solid #8b4513;
            border-radius: 5px;
            background-color: #2d1e15;
            color: white;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #8b4513;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #a0522d;
        }
        
        .info-bar {
            background-color: rgba(0, 0, 0, 0.8);
            color: #ffff00;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 12px;
        }
        
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 100;
        }
        
        .arm {
            transition: transform 0.1s ease;
        }
        
        .leg {
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Minecraft Villager Chat 🎮</h1>
        
        <div class="info-bar" id="infoBar">
            Animation: idle | Formula: none
        </div>
        
        <div class="villager-container" id="villagerContainer">
            <canvas class="villager-canvas" id="villagerCanvas" width="200" height="300"></canvas>
        </div>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message villager-message">Hello! I'm a villager. Type 'help' for commands!</div>
            </div>
            
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message..." />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Villager state and animations
        const villagerState = {
            animation: 'idle',
            animTime: 0,
            raiseArmsValue: 0,
            mood: 'neutral',
            particles: [],
            canvas: null,
            ctx: null
        };

        // Animation formulas (Bedrock Edition style)
        const animations = {
            general: {
                description: 'General arm movement',
                formula: () => ({ x: -42.97, y: 0, z: 0 })
            },
            move: {
                description: 'Leg movement for walking',
                formula: (time) => ({
                    legRotation: Math.cos(time * 38.17) * 40.0
                })
            },
            getInBed: {
                description: 'Body rotation for sleeping',
                formula: () => ({ bodyX: -90, bodyY: 0, bodyZ: 0 })
            },
            raiseArms: {
                description: 'Arm raising based on variable',
                formula: (raiseArms) => ({ armRotation: raiseArms * -15.0 })
            }
        };

        // Initialize
        function init() {
            villagerState.canvas = document.getElementById('villagerCanvas');
            villagerState.ctx = villagerState.canvas.getContext('2d');
            startAnimationLoop();
            updateInfoBar();
        }

        // Update info bar with current animation info
        function updateInfoBar() {
            const infoBar = document.getElementById('infoBar');
            let formulaText = 'none';
            
            if (villagerState.animation !== 'idle') {
                const anim = animations[villagerState.animation];
                if (anim) {
                    formulaText = anim.description;
                }
            }
            
            infoBar.textContent = `Animation: ${villagerState.animation} | Formula: ${formulaText}`;
        }

        // Draw villager with current animation state
        function drawVillager() {
            const ctx = villagerState.ctx;
            const canvas = villagerState.canvas;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Calculate animation values
            const moveAnim = animations.move.formula(villagerState.animTime);
            const raiseAnim = animations.raiseArms.formula(villagerState.raiseArmsValue);
            
            // Draw villager body parts
            ctx.save();
            
            // Body (can rotate when sleeping)
            if (villagerState.animation === 'getInBed') {
                const bedAnim = animations.getInBed.formula();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(bedAnim.bodyX * Math.PI / 180);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
            }
            
            // Draw body rectangle
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(canvas.width / 2 - 15, canvas.height / 2 - 40, 30, 40);
            
            // Draw head
            ctx.fillStyle = '#DEB887';
            ctx.fillRect(canvas.width / 2 - 12, canvas.height / 2 - 60, 24, 24);
            
            // Draw eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(canvas.width / 2 - 8, canvas.height / 2 - 55, 4, 4);
            ctx.fillRect(canvas.width / 2 + 4, canvas.height / 2 - 55, 4, 4);
            
            // Draw arms
            const armOffset = villagerState.animation === 'general' ? 
                animations.general.formula().x : 0;
                
            // Left arm
            ctx.save();
            ctx.translate(canvas.width / 2 - 15, canvas.height / 2 - 30);
            if (villagerState.raiseArmsValue > 0) {
                ctx.rotate(raiseAnim.armRotation * Math.PI / 180);
            }
            ctx.fillRect(-5, -5, 10, 25);
            ctx.restore();
            
            // Right arm
            ctx.save();
            ctx.translate(canvas.width / 2 + 15, canvas.height / 2 - 30);
            if (villagerState.raiseArmsValue > 0) {
                ctx.rotate(-raiseAnim.armRotation * Math.PI / 180);
            }
            ctx.fillRect(-5, -5, 10, 25);
            ctx.restore();
            
            // Draw legs with walking animation
            const legOffset = villagerState.animation.includes('move') || villagerState.animation === 'dance' ? 
                moveAnim.legRotation : 0;
                
            // Left leg
            ctx.save();
            ctx.translate(canvas.width / 2 - 8, canvas.height / 2);
            if (Math.abs(legOffset) > 0.1) {
                ctx.rotate(legOffset * Math.PI / 180);
            }
            ctx.fillRect(-4, 0, 8, 25);
            ctx.restore();
            
            // Right leg
            ctx.save();
            ctx.translate(canvas.width / 2 + 8, canvas.height / 2);
            if (Math.abs(legOffset) > 0.1) {
                ctx.rotate(-legOffset * Math.PI / 180);
            }
            ctx.fillRect(-4, 0, 8, 25);
            ctx.restore();
            
            // Draw sleep effect (ZZZ)
            if (villagerState.animation === 'getInBed') {
                ctx.fillStyle = 'white';
                ctx.font = '16px Arial';
                ctx.fillText('Zzz', canvas.width / 2 - 10, canvas.height / 2 - 80);
            }
            
            ctx.restore();
            
            // Draw mood particles
            drawParticles();
        }

        // Particle system for effects
        function createParticle(type) {
            const particleTypes = {
                emerald: { color: '#00FF00', size: 4, life: 60 },
                heart: { color: '#FF69B4', size: 6, life: 90 },
                dust: { color: '#A0522D', size: 3, life: 30 }
            };
            
            const base = particleTypes[type] || particleTypes.dust;
            
            villagerState.particles.push({
                x: Math.random() * villagerState.canvas.width,
                y: Math.random() * villagerState.canvas.height,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                color: base.color,
                size: base.size,
                life: base.life,
                maxLife: base.life,
                type: type
            });
        }

        // Draw all particles
        function drawParticles() {
            const ctx = villagerState.ctx;
            
            for (let i = villagerState.particles.length - 1; i >= 0; i--) {
                const p = villagerState.particles[i];
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Update particle
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life--;
                
                if (p.life <= 0) {
                    villagerState.particles.splice(i, 1);
                }
            }
            
            ctx.globalAlpha = 1;
        }

        // Animation loop
        function startAnimationLoop() {
            function animate() {
                villagerState.animTime += 0.016; // ~60fps
                
                if (villagerState.animation === 'dance') {
                    villagerState.raiseArmsValue = Math.sin(villagerState.animTime * 8) * 0.8 + 0.2;
                } else {
                    villagerState.raiseArmsValue *= 0.9; // gradually lower arms
                }
                
                drawVillager();
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        // Add message to chat with typewriter effect
        async function addMessage(text, isPlayer = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isPlayer ? 'player-message' : 'villager-message'}`;
            
            if (!isPlayer) {
                // Typewriter effect for villager messages
                messageDiv.textContent = '';
                messagesDiv.appendChild(messageDiv);
                
                for (let char of text) {
                    messageDiv.textContent += char;
                    await new Promise(resolve => setTimeout(resolve, 30));
                }
            } else {
                messageDiv.textContent = text;
                messagesDiv.appendChild(messageDiv);
            }
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Process user command
        function processCommand(command) {
            const cmd = command.toLowerCase().trim();
            let response = "";
            let newAnimation = "idle";
            
            if (cmd.includes("emerald")) {
                response = "Ooh, shiny! *happy dance* 💚";
                newAnimation = "general";
                villagerState.mood = "happy";
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => createParticle('emerald'), i * 100);
                }
            } else if (cmd.includes("walk") || cmd.includes("move")) {
                response = "Walking around... 👟";
                newAnimation = "move";
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => createParticle('dust'), i * 200);
                }
            } else if (cmd.includes("sleep") || cmd.includes("bed")) {
                response = "Time for bed... Zzz 💤";
                newAnimation = "getInBed";
                villagerState.mood = "tired";
            } else if (cmd.includes("dance")) {
                response = "Dancing! 🕺";
                newAnimation = "dance";
            } else if (cmd.includes("love")) {
                response = "Love you too! ❤️";
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => createParticle('heart'), i * 200);
                }
            } else if (cmd.includes("bone")) {
                response = "Bone structure: head, body, arms[2], legs[2] - Bedrock Edition format 1.8.0";
            } else if (cmd.includes("formula")) {
                response = "Active formulas: general, move, getInBed, raiseArms";
            } else if (cmd.includes("help")) {
                response = "Commands: emerald, walk/move, sleep/bed, dance, love, bone, formula, help";
            } else {
                const responses = [
                    "Hmm, interesting... 🤔",
                    "I see what you mean!",
                    "That's cool!",
                    "Tell me more!",
                    "Nice weather today!",
                    "I like trading emeralds! 💚"
                ];
                response = responses[Math.floor(Math.random() * responses.length)];
            }
            
            villagerState.animation = newAnimation;
            updateInfoBar();
            addMessage(response, false);
        }

        // Send message handler
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, true);
                processCommand(message);
                input.value = "";
            }
        }

        // Handle Enter key
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
