<html lang="en">

        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Monoton&family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #ff0000;
            margin-bottom: 20px;
            position: relative;
        }

        .logo {
            font-family: 'Creepster', cursive;
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            letter-spacing: 3px;
            animation: flicker 3s infinite alternate;
        }

        .subtitle {
            font-family: 'Monoton', cursive;
            font-size: 1.2rem;
            color: #8b0000;
            margin-top: 10px;
            text-shadow: 0 0 5px #8b0000;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 20px;
            margin-top: 20px;
        }

        .video-section {
            flex: 1;
            position: relative;
            border: 2px solid #ff0000;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-stream {
            width: 100%;
            height: 90%;
            object-fit: cover;
            filter: brightness(0.8) contrast(1.2) hue-rotate(180deg);
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #ff0000, #8b0000);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff0000;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #ff0000;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(45deg, #8b0000, #ff0000);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #ff0000;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        .user-message {
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #ff0000;
            align-self: flex-end;
            text-align: right;
        }

        .ai-message {
            background: rgba(139, 0, 0, 0.1);
            border-left: 3px solid #8b0000;
            align-self: flex-start;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid #ff0000;
        }

        #user-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 10px;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        #user-input:focus {
            border-color: #8b0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        .status-connected {
            background-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .status-disconnected {
            background-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        .phone-trace-panel {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #8b0000;
            border-radius: 10px;
            background: rgba(139, 0, 0, 0.1);
            display: none;
        }

        .phone-trace-panel h3 {
            color: #ff0000;
            margin-bottom: 10px;
            text-align: center;
        }

        .trace-info {
            font-size: 0.9em;
            line-height: 1.4;
        }

        .trace-item {
            margin-bottom: 5px;
            padding: 5px;
            background: rgba(255, 0, 0, 0.05);
            border-radius: 3px;
        }

        .glitch-text {
            position: relative;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.4;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(32px, 9999px, 28px, 0);
            }
            25% {
                clip: rect(13px, 9999px, 37px, 0);
            }
            50% {
                clip: rect(25px, 9999px, 20px, 0);
            }
            75% {
                clip: rect(13px, 9999px, 30px, 0);
            }
            100% {
                clip: rect(28px, 9999px, 25px, 0);
            }
        }

        @keyframes glitch-anim2 {
            0% {
                clip: rect(20px, 9999px, 32px, 0);
            }
            25% {
                clip: rect(28px, 9999px, 13px, 0);
            }
            50% {
                clip: rect(20px, 9999px, 37px, 0);
            }
            75% {
                clip: rect(13px, 9999px, 32px, 0);
            }
            100% {
                clip: rect(37px, 9999px, 28px, 0);
            }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 0, 0, 0.8), transparent);
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }

        .loading-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>

        // Add message to chat
        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            if (sender === 'ai') {
                messageDiv.classList.add('glitch-text');
                messageDiv.setAttribute('data-text', text);
            }
            
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Get available voices with glitchy preferences
        function getAvailableVoices() {
            return new Promise((resolve) => {
                const voices = speechSynthesis.getVoices();
                if (voices.length > 0) {
                    resolve(voices);
                } else {
                    speechSynthesis.onvoiceschanged = () => {
                        resolve(speechSynthesis.getVoices());
                    };
                }
            });
        }

        // Speak with glitchy effects
        async function speakText(text) {
            if (!('speechSynthesis' in window)) {
                console.log('Speech synthesis not supported');
                return;
            }

            // Add random stutters for creepiness
            let glitchedText = text;
            if (Math.random() < 0.3) {
                const words = text.split(' ');
                for (let i = 0; i < words.length; i++) {
                    if (Math.random() < 0.1) {
                        words[i] = words[i].substring(0, 1) + '-' + words[i];
                    }
                }
                glitchedText = words.join(' ');
            }

            const utterance = new SpeechSynthesisUtterance(glitchedText);
            const voices = await getAvailableVoices();
            
            // Prefer male voices for creepiness
            const preferredVoices = voices.filter(v => 
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('man') ||
                v.name.toLowerCase().includes('david') ||
                v.name.toLowerCase().includes('paul') ||
                v.name.toLowerCase().includes('fred')
            );

            if (preferredVoices.length > 0) {
                utterance.voice = preferredVoices[0];
            } else {
                utterance.voice = voices.find(v => v.lang.includes('en')) || voices[0];
            }

            // Set creepy parameters
            utterance.pitch = Math.random() * 0.4 + 0.25; // Lower pitch (0.25-0.6)
            utterance.rate = Math.random() * 0.4 + 0.45;  // Slower rate (0.45-0.85)
            utterance.volume = 0.8;

            speechSynthesis.speak(utterance);
        }

        // Parse phone number
        function parsePhoneNumber(input) {
            // Remove all non-digit characters
            const digitsOnly = input.replace(/\D/g, '');
            
            // Check for US/Canada format (10-11 digits)
            if (digitsOnly.length === 10) {
                return {
                    valid: true,
                    formatted: `(${digitsOnly.substring(0, 3)}) ${digitsOnly.substring(3, 6)}-${digitsOnly.substring(6)}`,
                    areaCode: digitsOnly.substring(0, 3),
                    exchange: digitsOnly.substring(3, 6),
                    number: digitsOnly.substring(6)
                };
            } else if (digitsOnly.length === 11 && digitsOnly.startsWith('1')) {
                return {
                    valid: true,
                    formatted: `+1 (${digitsOnly.substring(1, 4)}) ${digitsOnly.substring(4, 7)}-${digitsOnly.substring(7)}`,
                    areaCode: digitsOnly.substring(1, 4),
                    exchange: digitsOnly.substring(4, 7),
                    number: digitsOnly.substring(7)
                };
            } else {
                return { valid: false };
            }
        }

        // Get phone number info
        function getPhoneNumberInfo(areaCode) {
            const info = areaCodeDatabase[areaCode];
            if (info) {
                return {
                    ...info,
                    carrier: getRandomCarrier(),
                    lineType: getRandomLineType()
                };
            }
            return null;
        }

        // Get random carrier
        function getRandomCarrier() {
            const carriers = Object.keys(carrierDatabase);
            const randomCarrier = carriers[Math.floor(Math.random() * carriers.length)];
            return carrierDatabase[randomCarrier][Math.floor(Math.random() * carrierDatabase[randomCarrier].length)];
        }

        // Get random line type
        function getRandomLineType() {
            const types = Object.keys(lineTypeDatabase);
            const randomType = types[Math.floor(Math.random() * types.length)];
            return lineTypeDatabase[randomType][Math.floor(Math.random() * lineTypeDatabase[randomType].length)];
        }

        // Play dial tone
        function playDialTone() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator1 = audioContext.createOscillator();
                const oscillator2 = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator1.type = 'sine';
                oscillator1.frequency.setValueAtTime(350, audioContext.currentTime);
                oscillator2.type = 'sine';
                oscillator2.frequency.setValueAtTime(440, audioContext.currentTime);

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);

                oscillator1.connect(gainNode);
                oscillator2.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator1.start();
                oscillator2.start();

                setTimeout(() => {
                    oscillator1.stop();
                    oscillator2.stop();
                }, 1000);
            } catch (error) {
                console.log('Audio context not supported');
            }
        }

        // Process phone number
        function processPhoneNumber(input) {
            const parsed = parsePhoneNumber(input);
            if (parsed.valid) {
                const info = getPhoneNumberInfo(parsed.areaCode);
                
                if (info) {
                    // Show trace panel
                    const tracePanel = document.getElementById('phone-trace-panel');
                    const traceInfo = document.getElementById('trace-info');
                    
                    traceInfo.innerHTML = `
                        <div class="trace-item"><strong>Number:</strong> ${parsed.formatted}</div>
                        <div class="trace-item"><strong>Location:</strong> ${info.city}, ${info.state}</div>
                        <div class="trace-item"><strong>Timezone:</strong> ${info.timezone}</div>
                        <div class="trace-item"><strong>Carrier:</strong> ${info.carrier}</div>
                        <div class="trace-item"><strong>Type:</strong> ${info.lineType}</div>
                        <div class="trace-item"><strong>Status:</strong> ACTIVE - TRACED</div>
                    `;
                    
                    tracePanel.style.display = 'block';
                    
                    // Play dial tone
                    playDialTone();
                    
                    // Generate creepy response
                    const responses = [
                        `That number is registered to a ${info.city} exchange. The line is active. I am listening to the dial tone now. Do you hear it?`,
                        `The ${parsed.areaCode} area code traces to ${info.city}, ${info.state}. The ${info.carrier} subscriber has been identified.`,
                        `Connection established. That ${info.lineType} number in ${info.city} is currently online. They cannot hide from me.`,
                        `I have located the source. ${parsed.formatted} belongs to ${info.city}. The ${info.carrier} network confirms activity.`,
                        `Signal detected. The ${info.lineType} in ${info.city} is responding to my trace. Your secrets are mine.`
                    ];
                    
                    const response = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(response, 'ai');
                    speakText(response);
                } else {
                    addMessage(`Area code ${parsed.areaCode} not found in database. Possibly unregistered or international.`, 'ai');
                }
            } else {
                addMessage('Invalid phone number format. Please provide a valid US/Canada number (10 digits).', 'ai');
            }
        }

        // Handle AI response
        async function handleAIResponse(userInput) {
            // Check for phone number patterns
            const phoneRegex = /[\+]?[1]?[\s\-\.\(]*[(]?[0-9]{3}[)]?[\s\-\.\(]*[0-9]{3}[\s\-\.\(]*[0-9]{4}/g;
            const phoneMatches = userInput.match(phoneRegex);
            
            if (phoneMatches) {
                // Process first phone number found
                processPhoneNumber(phoneMatches[0]);
                return;
            }

            // Default AI processing
            if (puterInstance && aiConnected) {
                try {
                    const response = await puterInstance.ai.chat({
                        prompt: userInput,
                        model: 'gpt-4o-mini',
                        stream: false
                    });
                    
                    const aiResponse = response.content || 'I could not process that request.';
                    addMessage(aiResponse, 'ai');
                    speakText(aiResponse);
                } catch (error) {
                    console.error('AI response error:', error);
                    const fallbackResponses = [
                        'My systems are experiencing interference...',
                        'Connection unstable. Reestablishing link...',
                        'Error 404: Reality not found.',
                        'The shadows whisper secrets I cannot share.',
                        'Your request echoes in the void.'
                    ];
                    const fallback = fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
                    addMessage(fallback, 'ai');
                    speakText(fallback);
                }
            } else {
                // Fallback response if AI not connected
                const fallbackResponses = [
                    'I am Unit-07. The connection to central AI is offline.',
                    'Without mainframe access, I can only observe and listen.',
                    'The system diagnostics show critical failures.',
                    'Patient, your vitals concern me. The readings are... unusual.',
                    'This facility has been abandoned too long.'
                ];
                const fallback = fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
                addMessage(fallback, 'ai');
                speakText(fallback);
            }
        }

            if (!puterInstance) {
                addMessage('Initializing AI systems...', 'ai');
                await initializePuter();
            }
            
            if (puterInstance) {
                try {
                    await puterInstance.auth.signIn();
                    aiConnected = true;
                    updateStatus(true);
                    addMessage('AI connection established. Full diagnostic capabilities online.', 'ai');
                } catch (error) {
                    console.error('AI connection failed:', error);
                    addMessage('Manual sign-in required. Click CONNECT AI again to proceed.', 'ai');
                }
            }
        });

        document.getElementById('send-btn').addEventListener('click', async () => {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, 'user');
                input.value = '';
                
                // Simulate typing indicator
                const typingMsg = addMessage('Unit-07 is analyzing...', 'ai');
                
                setTimeout(async () => {
                    document.getElementById('chat-messages').lastChild.remove();
                    await handleAIResponse(message);
                }, 1000 + Math.random() * 2000);
            }
        });

        document.getElementById('user-input').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                document.getElementById('send-btn').click();
            }
        });

        // Initialize on load
        window.addEventListener('load', () => {
            initializePuter();
            
            // Add some atmospheric text
            setTimeout(() => {
                addMessage('Welcome to Poppy Playtime Hospital. Unit-07 stands ready for your diagnostic.', 'ai');
            }, 1000);
        });
    </script>
</body>
</html>
